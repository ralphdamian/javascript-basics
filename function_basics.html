<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        function add7 (num){
            return num + 7; 
        }

        function multiply (a, b) {
            return a * b;
        }

        function capitalize (text) {
            let lowerText = text.toLowerCase()
            const newText = lowerText.charAt(0).toUpperCase() + lowerText.slice(1);
            return newText;
        }

        function returnLastLetter (text) {
            return text.charAt(text.length -1);
        }

        console.log(add7(10));

        console.log(multiply(2,4));

        console.log(capitalize("Chris White Is Fat and bald."));

        console.log(returnLastLetter("abcd"));

    </script>
</body>
</html>
