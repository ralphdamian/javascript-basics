<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple DOM example</title>
    <style>
        .highlight {
            color: white;
            background-color: black;
            padding: 10px;
            width: 250px;
            text-align: center;
        }
    </style>
  </head>
  <body>
      <section>
        <img src="./images/dinosaur.png" alt="A red Tyrannosaurus Rex: A two legged dinosaur standing upright like a human, with small arms, and a large head with lots of sharp teeth.">
        <p>Here we will add a link to the <a href="https://www.mozilla.org/">Mozilla homepage</a></p>
      </section>

      <script>
        // select the only a element and store it in a variable named link
        const link = document.querySelector("a");
        // change the text of the link 
        link.textContent  = "Mozilla Developer Network";
        // change the href of the link
        link.href = "https://developer.mozilla.org";
        // select the section element and store it in a variable named sect
        const sect = document.querySelector("section");
        // create a p element and store it in a variable named para
        const para = document.createElement("p");
        // set the textContent of the p element
        para.textContent = "We hope you enjoyed the ride.";
        // append the paragraph to the end of the section
        sect.appendChild(para);
        // create a textnode and assign it to the variable text
        const text = document.createTextNode(" - the premier source for web development knowledge.");
        // select the p the lin kis inside of and append the node to it
        const linkPara = document.querySelector("p");
        linkPara.appendChild(text);
        // move the p element with the link inside of it to the bottom of the section
        sect.appendChild(linkPara);

        para.style.color = "white";
        para.style.backgroundColor = "black";
        para.style.padding = "10px";
        para.style.width = "250px";
        para.style.textAlign = "center";

        para.classList.add("highlight");

      </script>
  </body>
</html>
